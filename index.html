<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barça Visuals | HD Wallpapers, Edits &amp; Football Stories</title>
<meta name="description" content="Free HD football wallpapers for phone and desktop, matchday edits and articles about young talents.">
<meta name="theme-color" content="#0b1020">
<style>
:root{
  --bg:#0b1020; --bg2:#121936; --card:#161e3f; --text:#eef1ff; --muted:#9aa6d6;
  --blue:#2b4fd8; --garnet:#a50044; --gold:#edbb00; --radius:14px; --maxw:1100px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-text-size-adjust:100%}
a{color:var(--gold);text-decoration:none}
a:hover{text-decoration:underline}
img{max-width:100%;display:block}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px}

/* header */
header.site{position:sticky;top:0;z-index:20;background:rgba(11,16,32,.92);backdrop-filter:blur(8px);border-bottom:1px solid #1f2a55}
header.site .wrap{display:flex;align-items:center;justify-content:space-between;height:58px}
.logo{font-weight:800;font-size:1.1rem;letter-spacing:.2px;color:var(--text)}
.logo span{background:linear-gradient(90deg,var(--blue),var(--garnet));-webkit-background-clip:text;background-clip:text;color:transparent}
nav.main{display:flex;gap:4px;flex-wrap:wrap}
nav.main a{color:var(--muted);padding:8px 10px;border-radius:8px;font-size:.92rem}
nav.main a.active,nav.main a:hover{color:var(--text);background:var(--bg2);text-decoration:none}
.menu-btn{display:none;background:none;border:1px solid #2a3770;color:var(--text);border-radius:8px;padding:6px 10px;font-size:1.1rem}
@media(max-width:640px){
  .menu-btn{display:block}
  nav.main{display:none;position:absolute;top:58px;left:0;right:0;background:var(--bg);border-bottom:1px solid #1f2a55;flex-direction:column;padding:8px 16px}
  nav.main.open{display:flex}
}

/* hero */
.hero{padding:56px 0 40px;text-align:center;background:radial-gradient(900px 300px at 50% -50px,rgba(43,79,216,.35),transparent),radial-gradient(600px 240px at 80% 0,rgba(165,0,68,.25),transparent)}
.hero h1{font-size:clamp(1.9rem,6vw,3rem);line-height:1.15;margin-bottom:12px}
.hero p{color:var(--muted);max-width:560px;margin:0 auto 22px}
.btn{display:inline-block;background:linear-gradient(90deg,var(--blue),var(--garnet));color:#fff;border:0;padding:12px 22px;border-radius:999px;font-weight:700;font-size:.95rem;cursor:pointer}
.btn:hover{text-decoration:none;filter:brightness(1.1)}
.btn.ghost{background:transparent;border:1px solid #2f3d80;color:var(--text)}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* sections */
section.block{padding:34px 0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}
.sec-head h2{font-size:1.35rem}
.sec-head a{font-size:.9rem}

/* wallpaper grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr);gap:16px}}
.wp{position:relative;border-radius:var(--radius);overflow:hidden;background:var(--card);cursor:pointer;aspect-ratio:9/16;border:1px solid #1f2a55}
.wp img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.wp:hover img{transform:scale(1.04)}
.wp .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;color:#fff;font-weight:700}
.wp .cap{position:absolute;left:0;right:0;bottom:0;padding:26px 10px 10px;background:linear-gradient(transparent,rgba(0,0,0,.8));font-size:.82rem}
.wp .cap small{color:var(--muted);display:block}
.wp.desktop{aspect-ratio:16/10}

/* filters */
.tools{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
.search{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #2a3770;background:var(--bg2);color:var(--text);font-size:1rem}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--bg2);border:1px solid #2a3770;color:var(--muted);padding:7px 14px;border-radius:999px;font-size:.88rem;cursor:pointer}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(5,8,20,.94);z-index:50;display:none;align-items:center;justify-content:center;padding:16px;flex-direction:column;gap:14px}
.lb.open{display:flex}
.lb img{max-height:75vh;border-radius:12px}
.lb .ph{width:min(70vw,320px);aspect-ratio:9/16;border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;font-weight:700}
.lb .x{position:absolute;top:12px;right:16px;background:none;border:0;color:#fff;font-size:2rem;cursor:pointer}
.lb p{color:var(--muted);font-size:.9rem;text-align:center;max-width:420px}

/* article cards */
.cards{display:grid;gap:14px}
@media(min-width:700px){.cards{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--card);border:1px solid #1f2a55;border-radius:var(--radius);padding:18px;display:block;color:var(--text)}
.card:hover{border-color:#3a4cb0;text-decoration:none}
.card .tag{font-size:.75rem;color:var(--gold);text-transform:uppercase;letter-spacing:.06em}
.card h3{margin:6px 0;font-size:1.1rem}
.card p{color:var(--muted);font-size:.92rem}
.card .date{font-size:.8rem;color:var(--muted);margin-top:8px}

/* article page */
.article{max-width:720px;margin:0 auto;padding:30px 16px 50px}
.article h1{font-size:clamp(1.6rem,5vw,2.3rem);line-height:1.2;margin:6px 0 10px}
.article .meta{color:var(--muted);font-size:.88rem;margin-bottom:22px}
.article h2{margin:26px 0 8px;font-size:1.3rem}
.article p,.article ul{margin-bottom:14px;color:#d9defa}
.article ul{padding-left:22px}
.article li{margin-bottom:6px}

/* misc */
.notice{background:var(--bg2);border:1px solid #2a3770;border-radius:var(--radius);padding:16px;color:var(--muted);font-size:.9rem}
.page{max-width:720px;margin:0 auto;padding:34px 16px 50px}
.page h1{margin-bottom:14px}
.page h2{margin:24px 0 8px}
.page p,.page ul{margin-bottom:12px;color:#d9defa}
.page ul{padding-left:22px}
.empty{color:var(--muted);padding:30px 0;text-align:center}

footer.site{margin-top:40px;border-top:1px solid #1f2a55;padding:26px 0;color:var(--muted);font-size:.85rem;text-align:center}
footer.site .links{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}


/* masonry gallery (Pinterest-style) */
.grid.masonry{display:block;column-count:2;column-gap:12px}
@media(min-width:700px){.grid.masonry{column-count:4;column-gap:16px}}
.grid.masonry .wp{break-inside:avoid;margin-bottom:12px;aspect-ratio:auto}
@media(min-width:700px){.grid.masonry .wp{margin-bottom:16px}}
.grid.masonry .wp img{height:auto}
.grid.masonry .wp .ph{height:auto}
/* videos */
.vgrid{display:grid;gap:14px}
@media(min-width:700px){.vgrid{grid-template-columns:repeat(2,1fr)}}
.vid{background:var(--card);border:1px solid #1f2a55;border-radius:var(--radius);overflow:hidden}
.vid .frame{position:relative;aspect-ratio:16/9;background:#000;cursor:pointer}
.vid .frame img,.vid .frame iframe{width:100%;height:100%;object-fit:cover;border:0;display:block}
.vid .play{position:absolute;inset:0;margin:auto;width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.6rem;pointer-events:none}
.vid .vt{padding:12px 14px}
.vid .vt strong{display:block}
.vid .vt small{color:var(--muted)}
/* article images & embeds */
.card .thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;margin-bottom:12px}
.hero-img{margin:0 0 22px}
.hero-img img{width:100%;border-radius:var(--radius)}
.hero-img figcaption{color:var(--muted);font-size:.8rem;margin-top:6px}
.article iframe,.article .twitter-tweet,.article .instagram-media{max-width:100%}
.article .embed{margin:18px 0;display:flex;justify-content:center}
.article .yt{position:relative;aspect-ratio:16/9;margin:18px 0}
.article .yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:12px}
</style>
</head>
<body>
<header class="site">
  <div class="wrap">
    <a class="logo" href="#/"><span id="logo-name">Barça Visuals</span></a>
    <button class="menu-btn" aria-label="Menu" id="menuBtn">&#9776;</button>
    <nav class="main" id="mainNav">
      <a href="#/" data-v="home">Home</a>
      <a href="#/wallpapers" data-v="wallpapers">Wallpapers</a>
      <a href="#/videos" data-v="videos">Videos</a>
      <a href="#/articles" data-v="articles">Articles</a>
      <a href="#/about" data-v="about">About</a>
    </nav>
  </div>
</header>

<div id="app"></div>

<footer class="site" id="site-footer"></footer>

<script>
/* ============================================================
   EDIT THIS FILE to run your site. No other file needs changing.
   ============================================================ */

const SITE = {
  name: "Barça Visuals",
  tagline: "HD wallpapers, matchday edits & youth talent stories",
  pinterest: "https://www.pinterest.com/Dsportsxxf/", // check this matches your real profile link
  shop: "",   // paste your Ko-fi / Gumroad / Payhip link here when ready (leave "" to hide the button)
  email: ""   // optional contact email (leave "" to hide)
};

/* ---------- WALLPAPERS ----------
   1. Upload the image together with index.html, then put its file name in the image field
   2. Add one line below. Example:
      { title: "Matchday Night Edit", category: "Matchday", device: "Phone", image: "matchday-night.jpg", date: "2026-10-09" },
   Leave image: "" and a colour placeholder card is shown instead.
   Categories can be anything you like; filter buttons are made automatically.
   Only add images that you made yourself or have the right to use.
*/
const WALLPAPERS = [
  { title: "Blaugrana Glow",        category: "Abstract", device: "Phone",   image: "1ac3cb24-0aa8-4773-ba6c-66e890206ebf(1).jpg",   date: "2026-10-09" },
  { title: "The Number Ten",        category: "Numbers",  device: "Phone",   image: "IMG-20261010-WA0005.jpg",       date: "2026-10-09" },
  { title: "Pitch Blueprint",       category: "Matchday", device: "Phone",   image: "IMG-20261010-WA0006.jpg",  date: "2026-10-09" },
  { title: "Matchday: Game On",     category: "Matchday", device: "Phone",   image: "IMG-20261010-WA0007.jpg",         date: "2026-10-09" },
  { title: "Night Under the Lights",category: "Abstract", device: "Phone",   image: "IMG-20261010-WA0008.jpg",     date: "2026-10-09" },
  { title: "Next Generation",       category: "Youth",    device: "Desktop", image: "IMG-20261010-WA0009.jpg",  date: "2026-10-09" }
];

/* ---------- ARTICLES ----------
   Copy one block, change the text, keep the commas. "slug" is the short name used in the link
   (lowercase, hyphens, no spaces). "content" is HTML: use <p>, <h2>, <ul><li>, <a href="">.
   Newest first is best.

   OPTIONAL extras per article:
     image: "cover.jpg",  credit: "Photo: Name / Unsplash"   -> cover image and its credit line (use your own or free-licence images)
   EMBEDS you can paste straight into "content":
     YouTube:   <div class="yt"><iframe src="https://www.youtube-nocookie.com/embed/VIDEO_ID" allowfullscreen loading="lazy"></iframe></div>
     X post:    paste the embed code from the post's "Embed Post" option (it starts with <blockquote class="twitter-tweet">)
     Instagram: paste the embed code from the post's "Embed" option (<blockquote class="instagram-media" ...>)
     Pinterest: <a data-pin-do="embedPin" href="https://www.pinterest.com/pin/PIN_ID/"></a>
   Embedded posts stay owned by their authors and are shown with their credit. Prefer official sources.
*/
const ARTICLES = [
  {
    slug: "how-to-set-wallpaper-on-your-phone",
    title: "How to Set Any Wallpaper on Your Phone (Android & iPhone)",
    date: "2026-10-09",
    category: "Guides",
    excerpt: "Downloaded a wallpaper and not sure how to apply it? Here is the quick way on both Android and iPhone.",
    content: `
      <p>Got a new wallpaper from our gallery? Setting it takes less than a minute.</p>
      <h2>On Android</h2>
      <ul>
        <li>Download the image from the wallpaper page. It saves to your Gallery or Photos app.</li>
        <li>Open the image, tap the three dots (&#8942;), then choose <strong>Set as wallpaper</strong>.</li>
        <li>Pick <strong>Home screen</strong>, <strong>Lock screen</strong> or <strong>Both</strong>, then confirm.</li>
      </ul>
      <h2>On iPhone</h2>
      <ul>
        <li>Download the image, then open it in Photos.</li>
        <li>Tap the Share icon and choose <strong>Use as Wallpaper</strong>.</li>
        <li>Pinch to adjust the position, then tap <strong>Add</strong>.</li>
      </ul>
      <h2>Tips for a sharp result</h2>
      <ul>
        <li>Choose phone-sized (tall) wallpapers for your phone and wide ones for desktop.</li>
        <li>Turn off "Perspective Zoom" on iPhone if the image looks cropped.</li>
      </ul>
      <p>Browse more in the <a href="#/wallpapers">wallpaper gallery</a>.</p>`
  },
  {
    slug: "welcome-to-the-site",
    title: "Welcome: What You Will Find Here",
    date: "2026-10-08",
    category: "News",
    excerpt: "A quick tour of the wallpapers, edits and stories we publish.",
    content: `
      <p>This is a fan-made home for HD wallpapers, matchday graphics and stories about young talents.</p>
      <h2>What to expect</h2>
      <ul>
        <li>New wallpapers and edits throughout the week.</li>
        <li>Articles and guides for fans.</li>
        <li>Updates linked from our Pinterest boards.</li>
      </ul>
      <p>Replace this article with your own introduction, written in your own words.</p>`
  }
];

/* ---------- VIDEOS ----------
   Add the 11-character YouTube video ID (the part after v= in the link).
   Example: { title: "Official highlights", id: "XXXXXXXXXXX", note: "Source: official channel", date: "2026-10-09" },
   Prefer official club or league channels, or your own videos.
*/
const VIDEOS = [
  { title: "All the internationals are back | FC Barcelona training session", id: "s0Y932TvIe8", note: "Source: FC Barcelona (official YouTube channel)", date: "2026-10-09" }
];

</script>
<script>
(function () {
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function fmtDate(d) {
    try { return new Date(d + "T00:00:00").toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }); }
    catch (e) { return d; }
  }
  var GRADS = [
    "linear-gradient(160deg,#2b4fd8,#a50044)",
    "linear-gradient(160deg,#a50044,#edbb00)",
    "linear-gradient(160deg,#0b1020,#2b4fd8)",
    "linear-gradient(160deg,#edbb00,#2b4fd8)"
  ];
  var app = document.getElementById("app");
  var sorted = WALLPAPERS.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
  var sortedArt = ARTICLES.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });

  document.getElementById("logo-name").textContent = SITE.name;
  document.getElementById("menuBtn").onclick = function () {
    document.getElementById("mainNav").classList.toggle("open");
  };
  document.getElementById("site-footer").innerHTML =
    '<div class="wrap"><div class="links">' +
    (SITE.pinterest ? '<a href="' + esc(SITE.pinterest) + '" target="_blank" rel="noopener">Pinterest</a>' : "") +
    '<a href="#/about">About &amp; Copyright</a>' +
    (SITE.email ? '<a href="mailto:' + esc(SITE.email) + '">Contact</a>' : "") +
    "</div><p>&copy; " + new Date().getFullYear() + " " + esc(SITE.name) +
    ". Fan-made, not affiliated with or endorsed by any club, player or league.</p></div>";

  /* ---------- lightbox ---------- */
  var lb = document.createElement("div");
  lb.className = "lb";
  lb.addEventListener("click", function (e) { if (e.target === lb || e.target.className === "x") lb.classList.remove("open"); });
  document.body.appendChild(lb);
  function openLightbox(w, i) {
    var media = w.image
      ? '<img src="' + esc(w.image) + '" alt="' + esc(w.title) + '">'
      : '<div class="ph" style="background:' + GRADS[i % GRADS.length] + '">' + esc(w.title) + "</div>";
    var action = w.image
      ? '<a class="btn" href="' + esc(w.image) + '" download>Download</a>'
      : "<p>Placeholder card. Add a real image in the data section to enable download.</p>";
    lb.innerHTML = '<button class="x" aria-label="Close">&times;</button>' + media +
      "<strong>" + esc(w.title) + "</strong>" + action +
      (SITE.pinterest ? '<a class="btn ghost" href="' + esc(SITE.pinterest) + '" target="_blank" rel="noopener">Follow on Pinterest</a>' : "");
    lb.classList.add("open");
  }

  /* ---------- pieces ---------- */
  function wpCard(w, i) {
    var cls = "wp" + (w.device === "Desktop" ? " desktop" : "");
    var inner = w.image
      ? '<img loading="lazy" src="' + esc(w.image) + '" alt="' + esc(w.title) + '">'
      : '<div class="ph" style="background:' + GRADS[i % GRADS.length] + ';aspect-ratio:' + (w.device === "Desktop" ? "16/10" : "9/14") + '">' + esc(w.title) + "</div>";
    return '<div class="' + cls + '" data-i="' + i + '">' + inner +
      '<div class="cap">' + esc(w.title) + "<small>" + esc(w.category) + " &middot; " + esc(w.device) + "</small></div></div>";
  }
  function bindCards(container, list) {
    container.querySelectorAll(".wp").forEach(function (el) {
      el.addEventListener("click", function () {
        var i = +el.getAttribute("data-i");
        openLightbox(list[i], i);
      });
    });
  }
  function articleCard(a) {
    return '<a class="card" href="#/article/' + encodeURIComponent(a.slug) + '">' +
      (a.image ? '<img class="thumb" loading="lazy" src="' + esc(a.image) + '" alt="">' : "") +
      '<div class="tag">' + esc(a.category) + "</div><h3>" + esc(a.title) + "</h3><p>" + esc(a.excerpt) +
      '</p><div class="date">' + fmtDate(a.date) + "</div></a>";
  }

  /* ---------- embeds ---------- */
  function loadScript(src, cb) {
    if (document.querySelector('script[src="' + src + '"]')) { if (cb) cb(); return; }
    var sc = document.createElement("script");
    sc.async = true; sc.src = src; if (cb) sc.onload = cb;
    document.body.appendChild(sc);
  }
  function loadEmbeds(root) {
    var html = root.innerHTML;
    if (html.indexOf("twitter-tweet") > -1) {
      if (window.twttr && window.twttr.widgets) window.twttr.widgets.load(root);
      else loadScript("https://platform.twitter.com/widgets.js");
    }
    if (html.indexOf("instagram-media") > -1) {
      if (window.instgrm) window.instgrm.Embeds.process();
      else loadScript("https://www.instagram.com/embed.js");
    }
    if (html.indexOf("data-pin-do") > -1) {
      if (window.PinUtils) window.PinUtils.build(root);
      else loadScript("https://assets.pinterest.com/js/pinit.js");
    }
  }
  function videoCard(v) {
    var id = String(v.id || "");
    if (!/^[A-Za-z0-9_-]{11}$/.test(id)) return "";
    return '<div class="vid"><div class="frame" data-id="' + id + '">' +
      '<img loading="lazy" src="https://i.ytimg.com/vi/' + id + '/hqdefault.jpg" alt="' + esc(v.title) + '"><div class="play">&#9654;</div></div>' +
      '<div class="vt"><strong>' + esc(v.title) + "</strong>" + (v.note ? "<small>" + esc(v.note) + "</small>" : "") + "</div></div>";
  }
  function bindVideos(root) {
    root.querySelectorAll(".vid .frame").forEach(function (f) {
      f.addEventListener("click", function () {
        var id = f.getAttribute("data-id");
        f.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>';
      }, { once: true });
    });
  }
  var sortedVid = VIDEOS.slice().sort(function (a, b) { return (a.date || "") < (b.date || "") ? 1 : -1; });

  /* ---------- views ---------- */
  function viewHome() {
    app.innerHTML =
      '<section class="hero"><div class="wrap"><h1>' + esc(SITE.name) + "</h1><p>" + esc(SITE.tagline) + "</p>" +
      '<div class="btn-row"><a class="btn" href="#/wallpapers">Browse Wallpapers</a>' +
      '<a class="btn ghost" href="#/videos">Watch Videos</a>' +
      '<a class="btn ghost" href="#/articles">Read Articles</a>' +
      (SITE.shop ? '<a class="btn ghost" href="' + esc(SITE.shop) + '" target="_blank" rel="noopener">Shop &amp; Support</a>' : "") +
      "</div></div></section>" +
      '<main class="wrap"><section class="block"><div class="sec-head"><h2>Latest wallpapers</h2><a href="#/wallpapers">View all &rarr;</a></div><div class="grid masonry" id="g"></div></section>' +
      (sortedVid.length ? '<section class="block"><div class="sec-head"><h2>Latest videos</h2><a href="#/videos">All videos &rarr;</a></div><div class="vgrid" id="hv">' + sortedVid.slice(0, 2).map(videoCard).join("") + "</div></section>" : "") +
      '<section class="block"><div class="sec-head"><h2>From the blog</h2><a href="#/articles">All articles &rarr;</a></div><div class="cards">' +
      sortedArt.slice(0, 4).map(articleCard).join("") + "</div></section>" +
      '<section class="block"><div class="notice">Fan-made site. Not affiliated with or endorsed by any club, player or league. See <a href="#/about">About &amp; Copyright</a>.</div></section></main>';
    var latest = sorted.slice(0, 8);
    var g = document.getElementById("g");
    g.innerHTML = latest.map(function (w, i) { return wpCard(w, i); }).join("");
    bindCards(g, latest);
    var hv = document.getElementById("hv"); if (hv) bindVideos(hv);
  }

  function viewVideos() {
    app.innerHTML = '<main class="wrap"><section class="block"><div class="sec-head"><h2>Videos</h2></div>' +
      (sortedVid.length ? '<div class="vgrid" id="vg">' + sortedVid.map(videoCard).join("") + "</div>"
        : '<div class="notice">Videos are coming soon. Check back for highlights, edits and match reactions.</div>') +
      "</section></main>";
    var vg = document.getElementById("vg"); if (vg) bindVideos(vg);
  }

  function viewWallpapers() {
    app.innerHTML =
      '<main class="wrap"><section class="block"><div class="sec-head"><h2>Wallpapers</h2></div>' +
      '<div class="tools"><input class="search" id="search" type="search" placeholder="Search wallpapers..." aria-label="Search wallpapers"><div class="chips" id="chips"></div></div>' +
      '<div class="grid masonry" id="wp-grid"></div></section></main>';
    var cats = ["All"];
    sorted.forEach(function (w) { if (cats.indexOf(w.category) < 0) cats.push(w.category); });
    var cur = "All", q = "";
    var chips = document.getElementById("chips"), grid = document.getElementById("wp-grid");
    function render() {
      chips.innerHTML = cats.map(function (c) {
        return '<button class="chip' + (c === cur ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + "</button>";
      }).join("");
      chips.querySelectorAll(".chip").forEach(function (b) {
        b.onclick = function () { cur = b.getAttribute("data-c"); render(); };
      });
      var list = sorted.filter(function (w) {
        return (cur === "All" || w.category === cur) &&
          (w.title + " " + w.category + " " + w.device).toLowerCase().indexOf(q) >= 0;
      });
      grid.innerHTML = list.length ? list.map(function (w, i) { return wpCard(w, i); }).join("")
        : '<p class="empty">No wallpapers found.</p>';
      bindCards(grid, list);
    }
    document.getElementById("search").addEventListener("input", function (e) { q = e.target.value.toLowerCase(); render(); });
    render();
  }

  function viewArticles() {
    app.innerHTML = '<main class="wrap"><section class="block"><div class="sec-head"><h2>Articles</h2></div><div class="cards">' +
      sortedArt.map(articleCard).join("") + "</div></section></main>";
  }

  function viewArticle(slug) {
    var a = ARTICLES.filter(function (x) { return x.slug === slug; })[0];
    if (!a) {
      app.innerHTML = '<main class="article"><p class="empty">Article not found. <a href="#/articles">See all articles</a></p></main>';
      return;
    }
    document.title = a.title + " | " + SITE.name;
    app.innerHTML = '<main class="article"><div class="tag" style="font-size:.75rem;color:var(--gold);text-transform:uppercase;letter-spacing:.06em">' + esc(a.category) + "</div>" +
      "<h1>" + esc(a.title) + '</h1><div class="meta">' + fmtDate(a.date) + " &middot; " + esc(SITE.name) + "</div>" +
      (a.image ? '<figure class="hero-img"><img src="' + esc(a.image) + '" alt="' + esc(a.title) + '">' + (a.credit ? "<figcaption>" + esc(a.credit) + "</figcaption>" : "") + "</figure>" : "") +
      a.content + '<p style="margin-top:28px"><a class="btn ghost" href="#/articles">&larr; All articles</a></p></main>';
    loadEmbeds(app);
  }

  function viewAbout() {
    app.innerHTML = '<main class="page"><h1>About</h1>' +
      "<p>This is a fan-made site sharing football wallpapers, edits and articles. Edit this page and write your own story: who you are, why you make these visuals, and how often you post.</p>" +
      "<h2>Copyright &amp; disclaimer</h2>" +
      "<p>This site is an independent fan project. It is not affiliated with, authorised or endorsed by any football club, player, league or governing body. Club names, badges and player names remain the property of their respective owners.</p>" +
      "<p>Wallpapers and graphics published here are original edits or are used with the right to do so. If you own content shown here and want it credited or removed, contact us and we will act promptly.</p>" +
      "<h2>Embedded content</h2>" +
      "<p>Videos, posts and pins embedded on this site are served by their original platforms (YouTube, X, Instagram, Pinterest) and remain the property of their owners. We link and credit the source.</p>" +
      "<h2>Affiliate disclosure</h2>" +
      "<p>Some links on this site may be affiliate links. If you buy through them, we may earn a small commission at no extra cost to you.</p>" +
      "<h2>Privacy</h2>" +
      "<p>This site does not collect personal data itself. If you add analytics or ads later, update this section to say what they collect.</p>" +
      "<h2>Contact</h2><p>Message us on Pinterest" + (SITE.email ? " or email " + esc(SITE.email) : "") + ".</p></main>";
  }

  /* ---------- router ---------- */
  function route() {
    var parts = location.hash.replace(/^#\/?/, "").split("/");
    var v = parts[0] || "home";
    document.title = SITE.name + " | HD Wallpapers, Edits & Football Stories";
    lb.classList.remove("open");
    document.getElementById("mainNav").classList.remove("open");
    if (v === "wallpapers") viewWallpapers();
    else if (v === "videos") viewVideos();
    else if (v === "articles") viewArticles();
    else if (v === "article") viewArticle(decodeURIComponent(parts[1] || ""));
    else if (v === "about") viewAbout();
    else { v = "home"; viewHome(); }
    document.querySelectorAll("#mainNav a").forEach(function (a) {
      a.className = a.getAttribute("data-v") === (v === "article" ? "articles" : v) ? "active" : "";
    });
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
